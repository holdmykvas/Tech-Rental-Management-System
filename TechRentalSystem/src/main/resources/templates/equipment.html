<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equipment Catalog - Tech Rental</title>
</head>
<body>
<nav style="background-color: #333; color: white; padding: 10px;">
    <span style="font-weight: bold; margin-right: 20px;">Tech Rental System</span>
    <a th:href="@{/equipment}" style="color: white; margin-right: 15px;">Catalog</a>
    <a th:href="@{/cart}" style="color: white; margin-right: 15px;">My Cart</a>
    <a th:href="@{/login}" style="color: white; float: right;">Log out</a>
</nav>

<h2>Available Equipment</h2>

<div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px;">
    <div th:each="item : ${equipments}" style="border: 1px solid #ccc; padding: 15px; width: 250px; border-radius: 8px;">
        <h3 th:text="${item.name}" style="margin-top: 0;">Device Name</h3>
        <p><strong>Category:</strong> <span th:text="${item.category}">Category</span></p>
        <p th:text="${item.description}">Description goes here...</p>
        <p><strong>Price:</strong> $<span th:text="${item.price}">0.00</span> / day</p>
        <p><strong>In Stock:</strong> <span th:text="${item.stockQuantity}">0</span></p>

        <button style="background-color: green; color: white; border: none; padding: 10px; cursor: pointer; width: 100%;">
            Add to Cart
        </button>
    </div>
</div>

</body>
</html>
