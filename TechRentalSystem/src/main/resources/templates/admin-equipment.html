<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Equipment - Tech Rental</title>
</head>
<body>
<nav style="background-color: darkred; color: white; padding: 10px;">
    <a th:href="@{/admin/dashboard}" style="color: white; margin-right: 15px;">Manage Inventory</a>
</nav>

<h2>Add New Equipment</h2>

<form th:action="@{/admin/equipment/add}" th:object="${equipmentDto}" method="POST">
    <table cellpadding="5">
        <tr>
            <td>Name:</td>
            <td><input type="text" th:field="*{name}" required></td>
        </tr>
        <tr>
            <td>Description:</td>
            <td><textarea th:field="*{description}" rows="4" cols="30" required></textarea></td>
        </tr>
        <tr>
            <td>Daily Price:</td>
            <td><input type="number" step="0.01" th:field="*{price}" required></td>
        </tr>
        <tr>
            <td>Stock Quantity:</td>
            <td><input type="number" th:field="*{stockQuantity}" required></td>
        </tr>
        <tr>
            <td>Category:</td>
            <td>
                <select th:field="*{category}" required>
                    <!-- Iterates through the Category enum dynamically -->
                    <option th:each="cat : ${T(pj.techrentalsystem.Enums.Category).values()}"
                            th:value="${cat}"
                            th:text="${cat}"></option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center; padding-top: 15px;">
                <button type="submit">Save Equipment</button>
                <a th:href="@{/admin/dashboard}">
                    <button type="button">Cancel</button>
                </a>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
