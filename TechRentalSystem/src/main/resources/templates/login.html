<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Log in</h1>

    <div th:if="${param.error}" style="color : red"> Invalid email or password.</div>

    <div th:if="${param.logout}" style="color : green"> You have been logged out.</div>

    <div th:if="${param.success}" style="color : green"> Registration successful. Log in</div>


    <form th:action="@{/login}" method="POST">
        <table>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="email" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" required></td>
            </tr>
            <tr>
                <td><input type="submit" value="Log in"></td>
            </tr>
        </table>
    </form>

    <p> Want to create an account? <a th:href="@{/register}">Register here</a></p>
</body>
</html>
